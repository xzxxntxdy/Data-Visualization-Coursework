<!DOCTYPE html>
<html>
<head>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <title>快速测试图片加载</title>
    <style>
        body { font-family: Arial; padding: 20px; }
        .test { width: 500px; height: 400px; border: 1px solid #ccc; background: #f5f5f5; }
        #panel1, #panel2 { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <h2>测试1：pipeline方式（在当前HTML中）</h2>
    <div class="test" id="panel1"></div>
    
    <h2>测试2：image-explorer方式</h2>
    <div class="test" id="panel2"></div>

    <script>
        // 测试1：像pipeline一样
        const imageId1 = '000000000785';
        const imageUrl1 = `./visualized/${imageId1}_viz.jpg`;
        d3.select('#panel1').html(`
            <div style="position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #f8fafc;">
                <img 
                    src="${imageUrl1}" 
                    alt="推理结果"
                    style="max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px;"
                />
            </div>
        `);
        console.log('测试1 URL:', imageUrl1);

        // 测试2：像image-explorer一样
        const imageId2 = '000000000785';
        const imageUrl2 = `./visualized/${imageId2}_viz.jpg`;
        const panel2 = d3.select('#panel2');
        panel2.html(`
            <div style="position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; background: #f8fafc;">
                <img 
                    src="${imageUrl2}" 
                    alt="推理结果"
                    style="max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px;"
                />
            </div>
        `);
        console.log('测试2 URL:', imageUrl2);
    </script>
</body>
</html>
